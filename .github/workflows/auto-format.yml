
name: Auto Format Java

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download google-java-format
        run: |
          curl -L \
            https://github.com/google/google-java-format/releases/download/v1.25.2/google-java-format-1.25.2-all-deps.jar \
            -o google-java-format.jar

      - name: Format Java files
        run: |
          find . -name "*.java" \
            -not -path "./.git/*" \
            -print0 | \
          xargs -0 -r java -jar google-java-format.jar --replace

      - name: Commit and push if changed
        run: |
          if git diff --quiet; then
            echo "No formatting changes"
            exit 0
          fi

          git config user.name "sourabhagarwal13"
          git config user.email "88553283+sourabhagarwal13@users.noreply.github.com"

          git add -u
          git commit -m "style: auto-format Java files"
          git push
